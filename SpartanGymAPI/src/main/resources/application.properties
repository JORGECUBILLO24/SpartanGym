spring.application.name=SpartanGymAPI
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/spartangym_db
spring.datasource.username=postgres
spring.datasource.password=123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate. The schema is managed by spartan_gym_schema.sql.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=VGhpc0lzQVNlY3JldEtleUZvclNwYXJ0YW5HeW1BUEkyMDI2MTIzNDU2Nzg5
jwt.expiration=86400000

# Password reset
app.web.reset-password-url=${APP_WEB_RESET_PASSWORD_URL:http://localhost:5173/restablecer-contrasena}
app.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:30}

# Mail is optional in local development.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
