spring.application.name=SpartanGymAPI
# Perfil activo por defecto. "local" carga application-local.properties (ej. Neon) si existe.
# En la nube (Render) se sobreescribe con la variable SPRING_PROFILES_ACTIVE.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
# Puerto: en local usa 8080; en la nube (Render) toma el que asigne la variable PORT.
server.port=${PORT:8080}

# PostgreSQL. En local usa los valores por defecto; en la nube (Neon/Render) se
# sobreescriben con variables de entorno para no exponer credenciales en el repo.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/spartangym_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate. The schema is managed by spartan_gym_schema.sql.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
# El SQL de Hibernate se imprime solo si se pide explicitamente (JPA_SHOW_SQL=true).
# Con esto encendido cada consulta ocupa ~15 lineas y tapa por completo los errores
# en los logs de Render, que son el unico lugar donde se pueden diagnosticar.
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_SHOW_SQL:false}

# Origenes permitidos para CORS (lista separada por comas), ej. el web desplegado.
# Sin esta linea el @Value de SecurityConfig buscaba la variable APP_CORS_ALLOWED_ORIGINS
# (asi traduce Spring el nombre de la propiedad) y por lo tanto APP_CORS_ORIGINS, que es la
# que documenta render.yaml, nunca se leia: siempre caia al default de localhost.
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# ============================================================
# Logging
# ============================================================
# En Render el plan free no incluye request logs, asi que los errores tienen que
# bastarse solos: GlobalExceptionHandler registra metodo + ruta + causa de cada
# excepcion, y los bugs reales salen con stack trace completo.
logging.level.ni.edu.uam.SpartanGymAPI=${LOG_LEVEL_APP:INFO}
# El stack trace va al log, nunca al cuerpo de la respuesta HTTP.
server.error.include-stacktrace=never

# JWT. El secreto se toma de la variable JWT_SECRET en produccion.
# Si falta, JwtService usa un secreto por defecto SOLO en el perfil "local"; en cualquier
# otro perfil el arranque falla explicitamente (ver JwtService.validarSecret).
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Password reset
app.web.reset-password-url=${APP_WEB_RESET_PASSWORD_URL:http://localhost:5173/restablecer-contrasena}
app.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:30}

# Mail is optional in local development.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
